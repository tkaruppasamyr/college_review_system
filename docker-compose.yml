version: '3.8'

services:
  mongodb:
    image: mongo:8.3
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    environment:
      # These MUST be in the mongodb service, not the backend
      - MONGO_INITDB_ROOT_USERNAME=collegerating
      - MONGO_INITDB_ROOT_PASSWORD=passWdcolleerating123
      - MONGO_INITDB_DATABASE=collagedb
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Uses the service name 'mongodb' as the host
      - MONGO_URI=mongodb://collegerating:passWdcolleerating123@mongodb:27017/collagedb?authSource=admin      

    depends_on:
      - mongodb
    volumes:
      # Syncs local code to the container for live reloading
      - ./backend:/app
      - /app/node_modules 
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # For client-side fetching in the browser, the API must be localhost.
      # For Server-Side Rendering (SSR) in Next.js, use http://backend:5000.
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - INTERNAL_API_URL=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    

volumes:
  mongo-data: